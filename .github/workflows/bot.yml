name: Bot YouTube Shorts 24/7

on:
  # ⏸️ BOT APAGADO — el dueño va a cambiar el motor de videos por una skill nueva.
  # Para ENCENDERLO: descomenta las 2 líneas del schedule y haz push.
  # schedule:
  #   - cron: "7 */2 * * *"
  workflow_dispatch: {}   # lanzamiento manual desde la pestaña Actions

# No solapar ejecuciones
concurrency:
  group: bot-youtube
  cancel-in-progress: false

# Permisos para guardar cola/estado en el repo
permissions:
  contents: write

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Descargar el bot
        uses: actions/checkout@v4

      - name: Python 3.12 con caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar credenciales (secretos cifrados de GitHub)
        env:
          CLIENT_SECRET_B64: ${{ secrets.CLIENT_SECRET_B64 }}
          TOKEN_PICKLE_B64: ${{ secrets.TOKEN_PICKLE_B64 }}
        run: |
          echo "$CLIENT_SECRET_B64" | base64 -d > client_secret.json
          echo "$TOKEN_PICKLE_B64" | base64 -d > token.pickle

      - name: Caché del modelo Whisper (evita re-descargar 500 MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-faster-small

      - name: Ejecutar un ciclo del bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --ciclo --sin-navegador

      - name: Guardar cola, estado y log en el repositorio
        run: |
          git config user.name "bot-yt[bot]"
          git config user.email "bot-yt[bot]@users.noreply.github.com"
          git add -A cola_videos/ 2>/dev/null || true
          [ -f bot_activity.log ] && git add bot_activity.log || true
          [ -f estado_bot.json ] && git add estado_bot.json || true
          if ! git diff --cached --quiet; then
            git commit -m "🤖 estado del bot $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "Sin cambios que guardar"
          fi
