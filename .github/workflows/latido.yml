name: latido
on:
  schedule:
    - cron: "*/5 * * * *"   # señal de vida cada 5 minutos
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: latido
  cancel-in-progress: true

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Enviar latido a Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot/latido.py
